[project]
name = "ntcir-csat-search"
version = "0.1.0"
description = "Multimodal Audio/Video Semantic Search for NTCIR CSAT"
requires-python = ">=3.10"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # Async task queue
    "arq>=0.26.1",
    "redis>=5.0.4",

    # Vector DB
    "pymilvus>=2.4.3",

    # Object storage
    "minio>=7.2.7",

    # Audio processing
    "faster-whisper>=1.0.3",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "webrtcvad-wheels>=2.0.14",

    # Video processing
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.3.0",

    # Embedding models
    "open-clip-torch>=2.24.0",
    "sentence-transformers>=3.0.1",
    "transformers>=4.41.0",
    "torch>=2.3.0",

    # Memory / graph
    "networkx>=3.3",

    # Retrieval
    "rank-bm25>=0.2.2",

    # Utilities
    "numpy>=1.26.4",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "typer>=0.12.3",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.4",
    "rich>=13.7.1",

    # Offline dataset ingestion
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "storage", "workers", "model_zoo", "evaluation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
